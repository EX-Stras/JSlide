<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <title>Slide</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <main>
        <div class="wrapper">
            <ul class="slide">
                <li><img src="img/foto1.jpg" alt=""></li>
                <li><img src="img/foto2.jpg" alt=""></li>
                <li><img src="img/foto3.jpg" alt=""></li>
                <li><img src="img/foto4.jpg" alt=""></li>
                <li><img src="img/foto5.jpg" alt=""></li>
                <li><img src="img/foto6.jpg" alt=""></li>
            </ul>
        </div>
        <div class="buttons">
            <div class="button-prev">
                <button class="Bprev"><i class="material-symbols-outlined">keyboard_double_arrow_left</i></button>
            </div>
            <div class="button-next">
                <button class="Bnext"><i class="material-symbols-outlined">keyboard_double_arrow_right</i></button>
            </div>
        </div>
    </main>
</body>
    <script type="module" src="js/main.js"></script>
</html>
